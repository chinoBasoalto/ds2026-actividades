<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Tu CSS propio -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- En index.html agregamos el botón de prueba -->
    <div class="container mt-5 text-center">
        <button class="btn btn-primary">¡Hola Bootstrap!</button>
    </div>

    <!-- Bootstrap Bundle JS CDN (incluye Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Tu JS propio -->
    <script src="js/data.js"></script>
</body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <!-- Título con Ícono -->
    <a class="navbar-brand" href="index.html">
      📖 Librería UTN
    </a>

    <!-- Botón para móviles -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Links de navegación -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link active" href="index.html">Inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="catalogo.html">Catálogo</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="contacto.html">Contacto</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 shadow-lg p-4 rounded bg-light">
            <h2 class="text-center mb-4">Contactanos</h2>
            <p class="text-center text-muted mb-4">Completá el formulario y te responderemos a la brevedad.</p>
            
            <form id="form-contacto">
                <!-- Nombre -->
                <div class="mb-3">
                    <label for="nombre" class="form-label fw-bold">Nombre completo</label>
                    <input type="text" class="form-control" id="nombre" placeholder="Ej: Maria García" required>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label fw-bold">Correo electrónico</label>
                    <input type="email" class="form-control" id="email" placeholder="nombre@ejemplo.com" required>
                </div>

                <!-- Asunto (Select) -->
                <div class="mb-3">
                    <label for="asunto" class="form-label fw-bold">Asunto</label>
                    <select class="form-select" id="asunto" required>
                        <option value="" selected disabled>Seleccioná una opción...</option>
                        <option value="consulta">Consulta</option>
                        <option value="reclamo">Reclamo</option>
                        <option value="sugerencia">Sugerencia</option>
                    </select>
                </div>

                <!-- Mensaje (Textarea) -->
                <div class="mb-3">
                    <label for="mensaje" class="form-label fw-bold">Mensaje</label>
                    <textarea class="form-control" id="mensaje" rows="4" placeholder="Escribí tu mensaje aquí..." required></textarea>
                </div>

                <!-- Botón de Enviar -->
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">Enviar Mensaje</button>
                </div>
            </form>
        </div>
    </div>
</main>
</html>
